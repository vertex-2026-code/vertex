<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vertex · 甲趣 AI 美甲试戴</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #fff5f7 0%, #ffe5ec 50%, #ffd6e0 100%);
    min-height: 100vh;
  }
  .gradient-text {
    background: linear-gradient(135deg, #d4356b 0%, #ff6b9d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
    box-shadow: 0 8px 24px rgba(255, 107, 157, 0.35);
    transition: transform 0.1s;
  }
  .btn-primary:active:not(:disabled) { transform: scale(0.97); }
  .btn-primary:disabled {
    background: #e5e7eb;
    color: #9ca3af;
    box-shadow: none;
  }
  .style-card {
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 3px solid transparent;
  }
  .style-card.selected {
    border-color: #ff6b9d;
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
  }
  .style-card:active { transform: scale(0.94); }
  .style-card.selected:active { transform: scale(1.02); }
  .upload-tile {
    background: linear-gradient(135deg, #fff0f5 0%, #ffe5ec 100%);
    border: 2px dashed #ff8fab;
  }
  .upload-tile.has-image {
    border-style: solid;
    background: white;
  }
  @keyframes pulse-pink {
    0%, 100% { box-shadow: 0 8px 24px rgba(255, 107, 157, 0.35), 0 0 0 0 rgba(255, 107, 157, 0.6); }
    50%      { box-shadow: 0 8px 24px rgba(255, 107, 157, 0.35), 0 0 0 16px rgba(255, 107, 157, 0); }
  }
  .pulse { animation: pulse-pink 2s infinite; }
  .spinner {
    width: 56px; height: 56px;
    border: 5px solid rgba(255, 107, 157, 0.2);
    border-top-color: #ff6b9d;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .fade-in { animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .step-num {
    background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
    color: white;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .cat-tab {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
  }
  .cat-tab:not(.active) {
    background: #fce7f3;
    color: #9d174d;
  }
  /* 结果图：保持原图比例 + 占满弹窗宽度 */
  #result-img {
    width: 100%;
    height: auto;
    max-height: 70vh;
    object-fit: contain;
    background: #ffe5ec;
  }
  .my-tab {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .my-tab.active {
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
  }
  .my-tab:not(.active) {
    background: #fce7f3;
    color: #9d174d;
  }
  .history-thumb {
    border-radius: 12px;
    aspect-ratio: 1;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .history-thumb:active { transform: scale(0.95); }
  .fav-card {
    background: #fff5f7;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .fav-card img {
    width: 56px; height: 56px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="max-w-md mx-auto px-4 py-5 pb-32">

  <header class="text-center mb-5 relative">
    <button id="my-btn" class="absolute right-0 top-1 bg-white/80 backdrop-blur text-pink-500 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm active:bg-pink-50 border border-pink-200">
      我的
    </button>
    <h1 class="text-4xl font-black gradient-text tracking-tight">Vertex · 甲趣</h1>
    <p class="text-xs text-gray-500 mt-1 tracking-wider">AI · 美甲一秒上身</p>
  </header>

  <!-- 昵称输入 -->
  <section class="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm mb-3 slide-up">
    <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
      <span class="step-num">0</span><span>你的昵称</span>
    </h2>
    <input type="text" id="nickname-input" maxlength="12" placeholder="输入昵称，方便我们记住你"
      class="w-full border-2 border-pink-200 focus:border-pink-400 rounded-xl px-4 py-3 text-sm outline-none transition bg-pink-50/50 placeholder-gray-400">
  </section>

  <!-- 步骤 1: 上传手部 -->
  <section class="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm mb-3 slide-up">
    <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
      <span class="step-num">1</span><span>上传你的手部照片</span>
    </h2>
    <label class="block">
      <input type="file" accept="image/*" id="hand-input" class="hidden">
      <div id="hand-preview" class="border-2 border-dashed border-pink-200 rounded-2xl text-center cursor-pointer hover:bg-pink-50/50 active:bg-pink-50 transition py-10">
        <svg class="w-10 h-10 mx-auto text-pink-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <p class="text-gray-500 text-sm font-medium">点这里拍照或选图</p>
        <p class="text-gray-400 text-xs mt-1">五指张开 · 光线均匀效果最好</p>
      </div>
    </label>
  </section>

  <!-- 步骤 2: 选款式 -->
  <section class="bg-white/80 backdrop-blur rounded-3xl p-5 shadow-sm mb-3 slide-up">
    <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
      <span class="step-num">2</span><span>选款式 · 或自己上传一张</span>
    </h2>
    <div id="cat-tabs" class="flex gap-1.5 mb-3 overflow-x-auto pb-1">
      <span class="cat-tab active" data-cat="all">全部</span>
      <span class="cat-tab" data-cat="A">Pureté</span>
      <span class="cat-tab" data-cat="B">Rosé</span>
      <span class="cat-tab" data-cat="C">Lumière</span>
      <span class="cat-tab" data-cat="D">Noir</span>
      <span class="cat-tab" data-cat="E">Avant-Garde</span>
    </div>
    <div id="styles-grid" class="grid grid-cols-3 gap-2 max-h-[60vh] overflow-y-auto">
      <!-- 第一格：上传自定义款式 -->
      <label class="style-card upload-tile rounded-xl overflow-hidden cursor-pointer relative aspect-square flex flex-col items-center justify-center" data-id="__custom__" id="custom-tile">
        <input type="file" accept="image/*" id="custom-style-input" class="hidden">
        <div id="custom-tile-content" class="text-center px-1">
          <svg class="w-7 h-7 mx-auto text-pink-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          <div class="text-[10px] font-bold text-pink-500 leading-tight">上传<br>自定义</div>
        </div>
      </label>
      <!-- 25 个预设由 JS 注入 -->
      <div class="text-center text-gray-400 col-span-2 py-4 text-sm" id="styles-loading">加载款式中...</div>
    </div>
  </section>
</div>

<!-- 底部固定按钮 -->
<div class="fixed bottom-0 inset-x-0 bg-gradient-to-t from-pink-50 via-pink-50 to-transparent pt-6 pb-5 px-4">
  <div class="max-w-md mx-auto">
    <button id="tryon-btn" class="btn-primary text-white font-bold py-4 rounded-2xl w-full text-base pulse" disabled>
      ✨ 开始 AI 试戴
    </button>
  </div>
</div>

<!-- Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50">
  <div class="bg-white rounded-3xl p-8 text-center mx-4 fade-in min-w-[260px]">
    <div class="spinner mx-auto mb-4"></div>
    <p class="text-gray-800 font-bold">AI 正在为你试戴...</p>
    <p class="text-gray-400 text-xs mt-2"><span id="loading-elapsed">0</span> 秒 · 通常 15-25 秒</p>
  </div>
</div>

<!-- 结果弹层 -->
<div id="result-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-3xl p-4 max-w-sm w-full max-h-[95vh] overflow-y-auto fade-in">
    <h2 class="text-center text-lg font-black gradient-text mb-3">✨ 试戴完成</h2>
    <img id="result-img" class="rounded-2xl mb-4">
    <div class="grid grid-cols-2 gap-2.5 mb-2.5">
      <button data-action="like" class="feedback-btn bg-pink-100 active:bg-pink-200 text-pink-600 py-3 rounded-xl font-bold text-sm">😍 喜欢</button>
      <button data-action="dislike" class="feedback-btn bg-gray-100 active:bg-gray-200 text-gray-600 py-3 rounded-xl font-bold text-sm">🤔 一般</button>
    </div>
    <button data-action="book" class="feedback-btn btn-primary text-white py-3.5 rounded-xl w-full font-bold text-sm mb-2">📍 找附近门店做这款</button>
    <button id="save-img" class="bg-gray-100 active:bg-gray-200 text-gray-700 py-3 rounded-xl w-full font-bold text-sm mb-2">💾 保存图片</button>
    <button id="close-result" class="text-gray-500 py-2 w-full text-xs">再试一款</button>
  </div>
</div>

<!-- 门店列表弹层 -->
<div id="shops-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-3xl p-5 max-w-sm w-full fade-in">
    <h2 class="text-center text-lg font-black gradient-text mb-1">推荐门店</h2>
    <p class="text-center text-xs text-gray-400 mb-4">能做这款美甲 · 按距离排序</p>
    <div id="shops-list" class="space-y-2 mb-3"></div>
    <button id="close-shops" class="text-gray-500 py-2 w-full text-xs">返回</button>
  </div>
</div>

<!-- 我的 弹层 -->
<div id="my-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-3xl p-5 max-w-sm w-full max-h-[95vh] overflow-y-auto fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-black gradient-text">我的 · <span id="my-nickname" class="text-pink-400"></span></h2>
      <button id="close-my" class="text-gray-400 text-xl leading-none px-2">&times;</button>
    </div>
    <!-- Tabs -->
    <div class="flex gap-2 mb-4">
      <span class="my-tab active" data-my-tab="history">试戴历史</span>
      <span class="my-tab" data-my-tab="favorites">收藏夹</span>
      <span class="my-tab" data-my-tab="hand">我的手部</span>
    </div>
    <!-- Tab contents -->
    <div id="my-tab-history" class="my-tab-content">
      <div id="history-grid" class="grid grid-cols-3 gap-2"></div>
      <p id="history-empty" class="text-center text-gray-400 text-sm py-8 hidden">还没有试戴记录</p>
    </div>
    <div id="my-tab-favorites" class="my-tab-content hidden">
      <div id="favorites-list" class="space-y-2"></div>
      <p id="favorites-empty" class="text-center text-gray-400 text-sm py-8 hidden">还没有收藏</p>
    </div>
    <div id="my-tab-hand" class="my-tab-content hidden">
      <div id="hand-original-container" class="text-center">
        <p id="hand-empty" class="text-gray-400 text-sm py-8">还没有上传过手部照片</p>
      </div>
    </div>
  </div>
</div>

<!-- 历史详情弹层 -->
<div id="history-detail" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center z-[60] p-3">
  <div class="bg-white rounded-3xl p-4 max-w-sm w-full max-h-[95vh] overflow-y-auto fade-in">
    <h2 class="text-center text-lg font-black gradient-text mb-3">试戴详情</h2>
    <img id="history-detail-img" class="rounded-2xl mb-3 w-full" style="max-height: 60vh; object-fit: contain; background: #ffe5ec;">
    <div id="history-detail-info" class="text-xs text-gray-500 text-center mb-3"></div>
    <button id="close-history-detail" class="text-gray-500 py-2 w-full text-xs">返回</button>
  </div>
</div>

<script>
  const $ = q => document.querySelector(q);
  const $$ = q => document.querySelectorAll(q);

  const userId = localStorage.getItem('jiaqu_uid') || 'u_' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('jiaqu_uid', userId);

  let handImage = null;
  let selectedStyle = null;        // 预设款式 id，如 "nail_05"
  let customStyleImage = null;     // 自定义款式 data URL
  let lastRequestId = null;
  let feedbackSent = new Set();

  // === 昵称持久化 ===
  const nicknameInput = $('#nickname-input');
  nicknameInput.value = localStorage.getItem('jiaqu_nickname') || '';
  nicknameInput.addEventListener('input', () => {
    localStorage.setItem('jiaqu_nickname', nicknameInput.value.trim());
    checkReady();
  });
  function getNickname() { return nicknameInput.value.trim(); }    // 已点过的 action，防重复

  // === 加载预设款式 ===
  let allStyleCards = [];
  fetch('/api/styles').then(r => r.json()).then(styles => {
    $('#styles-loading')?.remove();
    const grid = $('#styles-grid');
    styles.forEach(s => {
      const card = document.createElement('div');
      card.className = 'style-card rounded-xl overflow-hidden cursor-pointer relative bg-pink-50';
      card.dataset.id = s.id;
      card.dataset.cat = s.category;
      card.innerHTML = `<img src="${s.url}" class="w-full aspect-square object-cover" loading="lazy">`;
      grid.appendChild(card);
      allStyleCards.push(card);
    });
  });

  // === 分类筛选 ===
  $('#cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    $$('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const cat = tab.dataset.cat;
    allStyleCards.forEach(c => {
      c.style.display = (cat === 'all' || c.dataset.cat === cat) ? '' : 'none';
    });
  });

  // === 选预设款式 ===
  $('#styles-grid').addEventListener('click', e => {
    const c = e.target.closest('.style-card');
    if (!c) return;
    if (c.id === 'custom-tile') return;  // 自定义那格交给 input 自己处理
    $$('.style-card').forEach(x => x.classList.remove('selected'));
    c.classList.add('selected');
    selectedStyle = c.dataset.id;
    customStyleImage = null;             // 选预设就清掉自定义
    checkReady();
  });

  // === 自定义款式上传 ===
  $('#custom-style-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      customStyleImage = ev.target.result;
      const tile = $('#custom-tile');
      tile.classList.add('has-image');
      $('#custom-tile-content').innerHTML = `
        <img src="${customStyleImage}" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-pink-500/20 flex items-end justify-center pb-1">
          <span class="text-[9px] bg-white/90 text-pink-600 px-1.5 py-0.5 rounded-full font-bold">我的款式</span>
        </div>
      `;
      // 选中状态
      $$('.style-card').forEach(x => x.classList.remove('selected'));
      tile.classList.add('selected');
      selectedStyle = '__custom__';
      checkReady();
    };
    r.readAsDataURL(f);
  });

  // === 上传手部 ===
  $('#hand-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      handImage = ev.target.result;
      $('#hand-preview').innerHTML = `<img src="${handImage}" class="rounded-xl w-full max-h-72 object-contain bg-pink-50">`;
      $('#hand-preview').classList.remove('py-10', 'border-dashed');
      checkReady();
    };
    r.readAsDataURL(f);
  });

  function checkReady() {
    const styleReady = !!(selectedStyle && (selectedStyle !== '__custom__' || customStyleImage));
    $('#tryon-btn').disabled = !(handImage && styleReady && getNickname());
  }

  // === 试戴 ===
  $('#tryon-btn').addEventListener('click', async () => {
    if ($('#tryon-btn').disabled) return;
    feedbackSent.clear();
    $('#loading-overlay').classList.remove('hidden');
    $('#loading-overlay').classList.add('flex');
    // 计时器
    const t0 = Date.now();
    const timer = setInterval(() => {
      $('#loading-elapsed').textContent = Math.floor((Date.now() - t0) / 1000);
    }, 500);

    const body = { user_id: userId, nickname: getNickname(), hand_image: handImage };
    if (customStyleImage && selectedStyle === '__custom__') {
      body.custom_style_image = customStyleImage;
    } else {
      body.style_id = selectedStyle;
    }

    try {
      const r = await fetch('/api/tryon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      clearInterval(timer);
      if (data.error) throw new Error(data.error);
      lastRequestId = data.request_id;
      $('#result-img').src = data.result_url;
      // 重置反馈按钮状态
      $$('.feedback-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('opacity-50');
        const a = b.dataset.action;
        if (a === 'like') b.innerText = '😍 喜欢';
        if (a === 'dislike') b.innerText = '🤔 一般';
        if (a === 'book') b.innerText = '📍 找附近门店做这款';
      });
      $('#loading-overlay').classList.add('hidden');
      $('#result-overlay').classList.remove('hidden');
      $('#result-overlay').classList.add('flex');
    } catch (err) {
      clearInterval(timer);
      $('#loading-overlay').classList.add('hidden');
      alert('试戴失败：' + err.message);
    }
  });

  // === 反馈（防重复点击）===
  document.addEventListener('click', e => {
    const btn = e.target.closest('.feedback-btn');
    if (!btn || btn.disabled) return;
    const action = btn.dataset.action;
    if (action === 'book') {
      showShops();
      return;
    }
    if (feedbackSent.has(action)) return;
    feedbackSent.add(action);
    // disable 同组的两个互斥按钮
    if (action === 'like' || action === 'dislike') {
      $$('.feedback-btn[data-action="like"], .feedback-btn[data-action="dislike"]').forEach(b => {
        b.disabled = true;
        b.classList.add('opacity-50');
      });
    }
    btn.innerText = action === 'like' ? '✓ 已收藏' : '✓ 已记录';
    fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        request_id: lastRequestId, user_id: userId, nickname: getNickname(),
        style_id: selectedStyle === '__custom__' ? '用户上传' : selectedStyle,
        action,
      }),
    });
  });

  $('#close-result').addEventListener('click', () => {
    $('#result-overlay').classList.add('hidden');
  });

  // === 门店列表 ===
  function showShops() {
    fetch('/api/shops').then(r => r.json()).then(shops => {
      $('#shops-list').innerHTML = shops.map(s => `
        <div class="shop-card bg-pink-50 rounded-2xl p-3 active:bg-pink-100 cursor-pointer" data-shop="${s.id}">
          <div class="flex items-start justify-between gap-2">
            <div class="flex-1 min-w-0">
              <div class="font-bold text-sm text-gray-800 truncate">${s.name}</div>
              <div class="text-xs text-gray-500 mt-0.5">⭐ ${s.rating} · ${s.distance_km}km · 均价 ¥${s.price_avg}</div>
              <div class="text-[10px] text-pink-500 font-bold mt-0.5">${s.desc || ''}</div>
            </div>
            <button class="bg-pink-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg shrink-0">预约</button>
          </div>
        </div>
      `).join('');
      $('#shops-list').addEventListener('click', e => {
        const card = e.target.closest('.shop-card');
        if (!card) return;
        fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            request_id: lastRequestId, user_id: userId, nickname: getNickname(),
            style_id: selectedStyle === '__custom__' ? '用户上传' : selectedStyle,
            action: 'book', shop_id: card.dataset.shop,
          }),
        });
        alert('预约请求已发送 💅');
      });
      $('#shops-overlay').classList.remove('hidden');
      $('#shops-overlay').classList.add('flex');
    });
  }
  $('#close-shops').addEventListener('click', () => {
    $('#shops-overlay').classList.add('hidden');
  });

  // === 保存图片 ===
  $('#save-img').addEventListener('click', () => {
    const img = $('#result-img');
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `Vertex甲趣_${lastRequestId || 'result'}.png`;
    a.click();
  });

  // === 「我的」页面 ===
  $('#my-btn').addEventListener('click', () => {
    if (!getNickname()) {
      alert('请先输入昵称哦～');
      $('#nickname-input').focus();
      return;
    }
    $('#my-nickname').textContent = getNickname();
    $('#my-overlay').classList.remove('hidden');
    $('#my-overlay').classList.add('flex');
    loadMyData('history');
  });
  $('#close-my').addEventListener('click', () => {
    $('#my-overlay').classList.add('hidden');
    $('#my-overlay').classList.remove('flex');
  });

  // tab 切换
  document.querySelectorAll('.my-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.my-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.myTab;
      document.querySelectorAll('.my-tab-content').forEach(c => c.classList.add('hidden'));
      $(`#my-tab-${target}`).classList.remove('hidden');
      loadMyData(target);
    });
  });

  function loadMyData(tab) {
    if (tab === 'history') loadHistory();
    else if (tab === 'favorites') loadFavorites();
    else if (tab === 'hand') loadHandOriginal();
  }

  async function loadHistory() {
    const grid = $('#history-grid');
    const empty = $('#history-empty');
    grid.innerHTML = '<p class="text-gray-400 text-xs col-span-3 text-center py-4">加载中...</p>';
    empty.classList.add('hidden');
    try {
      const r = await fetch(`/api/user/history?user_id=${encodeURIComponent(userId)}`);
      const items = await r.json();
      if (!items.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      grid.innerHTML = items.map(item => `
        <img src="${item.result_image_url}" class="history-thumb w-full"
             data-result="${item.result_image_url}"
             data-style="${item.style_id || ''}"
             data-time="${item.created_at || ''}"
             loading="lazy">
      `).join('');
    } catch { grid.innerHTML = '<p class="text-red-400 text-xs col-span-3 text-center">加载失败</p>'; }
  }

  // 点击历史图查看详情
  $('#history-grid').addEventListener('click', e => {
    const thumb = e.target.closest('.history-thumb');
    if (!thumb) return;
    $('#history-detail-img').src = thumb.dataset.result;
    const time = thumb.dataset.time ? new Date(thumb.dataset.time).toLocaleString('zh-CN') : '';
    $('#history-detail-info').textContent = `${thumb.dataset.style || ''}${time ? ' · ' + time : ''}`;
    $('#history-detail').classList.remove('hidden');
    $('#history-detail').classList.add('flex');
  });
  $('#close-history-detail').addEventListener('click', () => {
    $('#history-detail').classList.add('hidden');
    $('#history-detail').classList.remove('flex');
  });

  async function loadFavorites() {
    const list = $('#favorites-list');
    const empty = $('#favorites-empty');
    list.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">加载中...</p>';
    empty.classList.add('hidden');
    try {
      const r = await fetch(`/api/user/favorites?user_id=${encodeURIComponent(userId)}`);
      const items = await r.json();
      if (!items.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      list.innerHTML = items.map(item => `
        <div class="fav-card" data-fav-id="${item.id}">
          ${item.style_url ? `<img src="${item.style_url}" alt="">` : '<div class="w-14 h-14 rounded-xl bg-pink-100 flex items-center justify-center text-pink-300 text-lg shrink-0">?</div>'}
          <div class="flex-1 min-w-0">
            <div class="font-bold text-sm text-gray-800 truncate">${item.style_id || '自定义款式'}</div>
            ${item.shop_name ? `<div class="text-xs text-gray-500 mt-0.5">${item.shop_name}</div>` : ''}
            <div class="text-[10px] text-gray-400 mt-0.5">${item.created_at ? new Date(item.created_at).toLocaleString('zh-CN') : ''}</div>
          </div>
          <button class="unfav-btn text-pink-400 text-xs font-bold px-2 py-1 rounded-lg bg-pink-50 active:bg-pink-100 shrink-0">取消</button>
        </div>
      `).join('');
    } catch { list.innerHTML = '<p class="text-red-400 text-xs text-center">加载失败</p>'; }
  }

  // 取消收藏
  $('#favorites-list').addEventListener('click', async e => {
    const btn = e.target.closest('.unfav-btn');
    if (!btn) return;
    const card = btn.closest('.fav-card');
    const favId = card.dataset.favId;
    try {
      await fetch(`/api/user/favorites/${favId}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE' });
      card.remove();
      if (!$('#favorites-list').children.length) {
        $('#favorites-empty').classList.remove('hidden');
      }
    } catch {}
  });

  async function loadHandOriginal() {
    const container = $('#hand-original-container');
    const empty = $('#hand-empty');
    container.innerHTML = '<p class="text-gray-400 text-xs py-4">加载中...</p>';
    try {
      const r = await fetch(`/api/user/hand?user_id=${encodeURIComponent(userId)}`);
      const data = await r.json();
      if (!data.image_path) {
        container.innerHTML = '';
        container.appendChild(empty);
        empty.classList.remove('hidden');
        return;
      }
      const time = data.updated_at ? new Date(data.updated_at).toLocaleString('zh-CN') : '';
      container.innerHTML = `
        <img src="${data.image_path}?t=${Date.now()}" class="rounded-2xl w-full mb-2" style="max-height: 60vh; object-fit: contain; background: #ffe5ec;">
        <p class="text-xs text-gray-400">${time ? '最近上传 · ' + time : ''}</p>
        <p class="text-xs text-gray-400 mt-1">每次试戴会自动保存你的原始手部照片</p>
      `;
    } catch { container.innerHTML = '<p class="text-red-400 text-xs">加载失败</p>'; }
  }
</script>
</body>
</html>

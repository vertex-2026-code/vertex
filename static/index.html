<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>甲趣 · AI 美甲试戴</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f2efed;
    min-height: 100vh;
    color: #1a1a1a;
  }
  .brand-title {
    font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
    font-size: 2.5rem;
    font-weight: 400;
    color: #1a1a1a;
    letter-spacing: 0.12em;
  }
  .btn-primary {
    background: #1a1a1a;
    color: #fff;
    transition: background 0.4s ease;
    letter-spacing: 0.08em;
  }
  .btn-primary:active:not(:disabled) { background: #000; }
  .btn-primary:disabled {
    background: #d4d0cc;
    color: #a09c98;
  }
  .style-card {
    transition: border-color 0.3s ease, opacity 0.2s ease;
    border: 1px solid #ddd8d3;
  }
  .style-card.selected {
    border-color: #1a1a1a;
    border-width: 2px;
  }
  .style-card:active { opacity: 0.8; }
  .upload-tile {
    background: #faf8f7;
    border: 1px dashed #c9c4bf;
  }
  .upload-tile.has-image {
    border-style: solid;
    background: #fff;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 2px solid #ddd8d3;
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slide-up { animation: slideUp 0.5s ease-out; }
  @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .step-num {
    background: #1a1a1a;
    color: #fff;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }
  .cat-tab {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    color: #999;
  }
  .cat-tab.active {
    color: #1a1a1a;
    border-bottom-color: #1a1a1a;
    font-weight: 600;
  }
  #result-img {
    width: 100%;
    height: auto;
    max-height: 70vh;
    object-fit: contain;
    background: #f2efed;
  }
  .section-card {
    background: #fff;
    border: 1px solid #e5e1dd;
  }
</style>
</head>
<body>
<div class="max-w-md mx-auto px-5 py-8 pb-36">

  <header class="text-center mb-10">
    <h1 class="brand-title">甲趣</h1>
    <p class="text-stone-400 mt-2 tracking-widest" style="font-size: 10px; letter-spacing: 0.25em;">AI · 美甲一秒上身</p>
  </header>

  <!-- 昵称输入 -->
  <section class="section-card p-6 mb-4 slide-up">
    <h2 class="text-sm font-semibold text-stone-700 mb-4 flex items-center gap-2">
      <span class="step-num">0</span><span>你的昵称</span>
    </h2>
    <input type="text" id="nickname-input" maxlength="12" placeholder="输入昵称，方便我们记住你"
      class="w-full border border-stone-200 focus:border-stone-800 px-4 py-3 text-sm outline-none transition duration-300 bg-stone-50/50 placeholder-stone-400" style="letter-spacing: 0.02em;">
  </section>

  <!-- 步骤 1: 上传手部 -->
  <section class="section-card p-6 mb-4 slide-up">
    <h2 class="text-sm font-semibold text-stone-700 mb-4 flex items-center gap-2">
      <span class="step-num">1</span><span>上传你的手部照片</span>
    </h2>
    <label class="block">
      <input type="file" accept="image/*" id="hand-input" class="hidden">
      <div id="hand-preview" class="border border-dashed border-stone-300 text-center cursor-pointer hover:bg-stone-50 active:bg-stone-100 transition duration-300 py-12">
        <svg class="w-8 h-8 mx-auto text-stone-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <p class="text-stone-500 text-sm">点这里拍照或选图</p>
        <p class="text-stone-400 text-xs mt-1">五指张开 · 光线均匀效果最好</p>
      </div>
    </label>
  </section>

  <!-- 步骤 2: 选款式 -->
  <section class="section-card p-6 mb-4 slide-up">
    <h2 class="text-sm font-semibold text-stone-700 mb-4 flex items-center gap-2">
      <span class="step-num">2</span><span>选款式 · 或自己上传一张</span>
    </h2>
    <div id="cat-tabs" class="flex gap-0 mb-4 overflow-x-auto border-b border-stone-200 pb-0">
      <span class="cat-tab active" data-cat="all">全部</span>
      <span class="cat-tab" data-cat="A">简约清透</span>
      <span class="cat-tab" data-cat="B">甜美可爱</span>
      <span class="cat-tab" data-cat="C">华丽璀璨</span>
      <span class="cat-tab" data-cat="D">暗黑酷飒</span>
      <span class="cat-tab" data-cat="E">潮流前卫</span>
    </div>
    <div id="styles-grid" class="grid grid-cols-3 gap-2 max-h-[60vh] overflow-y-auto">
      <label class="style-card upload-tile overflow-hidden cursor-pointer relative aspect-square flex flex-col items-center justify-center" data-id="__custom__" id="custom-tile">
        <input type="file" accept="image/*" id="custom-style-input" class="hidden">
        <div id="custom-tile-content" class="text-center px-1">
          <svg class="w-6 h-6 mx-auto text-stone-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"/></svg>
          <div class="text-[10px] font-medium text-stone-500 leading-tight">上传<br>自定义</div>
        </div>
      </label>
      <div class="text-center text-stone-400 col-span-2 py-4 text-sm" id="styles-loading">加载款式中...</div>
    </div>
  </section>
</div>

<!-- 底部固定按钮 -->
<div class="fixed bottom-0 inset-x-0 pt-8 pb-6 px-5" style="background: linear-gradient(to top, #f2efed 60%, transparent);">
  <div class="max-w-md mx-auto">
    <button id="tryon-btn" class="btn-primary font-semibold py-4 w-full text-sm" disabled>
      开始 AI 试戴
    </button>
  </div>
</div>

<!-- Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center z-50">
  <div class="bg-white p-10 text-center mx-4 fade-in" style="min-width: 260px;">
    <div class="spinner mx-auto mb-5"></div>
    <p class="text-stone-800 font-semibold text-sm tracking-wide">AI 正在为你试戴</p>
    <p class="text-stone-400 text-xs mt-2"><span id="loading-elapsed">0</span> 秒 · 通常 15-25 秒</p>
  </div>
</div>

<!-- 结果弹层 -->
<div id="result-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="bg-white p-5 max-w-sm w-full max-h-[95vh] overflow-y-auto fade-in">
    <h2 class="text-center text-base font-semibold text-stone-800 mb-4 tracking-wide" style="font-family: Georgia, 'Songti SC', serif;">试戴完成</h2>
    <img id="result-img" class="mb-5">
    <div class="grid grid-cols-2 gap-2 mb-2">
      <button data-action="like" class="feedback-btn border border-stone-200 hover:bg-stone-50 active:bg-stone-100 text-stone-700 py-3 text-sm font-medium transition duration-300">喜欢</button>
      <button data-action="dislike" class="feedback-btn border border-stone-200 hover:bg-stone-50 active:bg-stone-100 text-stone-500 py-3 text-sm font-medium transition duration-300">一般</button>
    </div>
    <button data-action="book" class="feedback-btn btn-primary py-3.5 w-full text-sm mb-2 font-medium">找附近门店做这款</button>
    <button id="save-img" class="border border-stone-200 hover:bg-stone-50 active:bg-stone-100 text-stone-600 py-3 w-full text-sm font-medium transition duration-300 mb-2">保存图片</button>
    <button id="close-result" class="text-stone-400 py-2 w-full text-xs hover:text-stone-600 transition duration-300">再试一款</button>
  </div>
</div>

<!-- 门店列表弹层 -->
<div id="shops-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
  <div class="bg-white p-6 max-w-sm w-full fade-in">
    <h2 class="text-center text-base font-semibold text-stone-800 mb-1 tracking-wide" style="font-family: Georgia, 'Songti SC', serif;">推荐门店</h2>
    <p class="text-center text-xs text-stone-400 mb-5">能做这款美甲 · 按距离排序</p>
    <div id="shops-list" class="space-y-2 mb-4"></div>
    <button id="close-shops" class="text-stone-400 py-2 w-full text-xs hover:text-stone-600 transition duration-300">返回</button>
  </div>
</div>

<script>
  const $ = q => document.querySelector(q);
  const $$ = q => document.querySelectorAll(q);

  const userId = localStorage.getItem('jiaqu_uid') || 'u_' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('jiaqu_uid', userId);

  let handImage = null;
  let selectedStyle = null;
  let customStyleImage = null;
  let lastRequestId = null;
  let feedbackSent = new Set();

  // === 昵称持久化 ===
  const nicknameInput = $('#nickname-input');
  nicknameInput.value = localStorage.getItem('jiaqu_nickname') || '';
  nicknameInput.addEventListener('input', () => {
    localStorage.setItem('jiaqu_nickname', nicknameInput.value.trim());
    checkReady();
  });
  function getNickname() { return nicknameInput.value.trim(); }

  // === 加载预设款式 ===
  let allStyleCards = [];
  fetch('/api/styles').then(r => r.json()).then(styles => {
    $('#styles-loading')?.remove();
    const grid = $('#styles-grid');
    styles.forEach(s => {
      const card = document.createElement('div');
      card.className = 'style-card overflow-hidden cursor-pointer relative bg-stone-50';
      card.dataset.id = s.id;
      card.dataset.cat = s.category;
      card.innerHTML = `<img src="${s.url}" class="w-full aspect-square object-cover" loading="lazy">
        <div class="absolute bottom-0 inset-x-0 bg-black/50 text-white text-[9px] font-medium text-center py-0.5 tracking-wider">${s.category_name}</div>`;
      grid.appendChild(card);
      allStyleCards.push(card);
    });
  });

  // === 分类筛选 ===
  $('#cat-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    $$('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const cat = tab.dataset.cat;
    allStyleCards.forEach(c => {
      c.style.display = (cat === 'all' || c.dataset.cat === cat) ? '' : 'none';
    });
  });

  // === 选预设款式 ===
  $('#styles-grid').addEventListener('click', e => {
    const c = e.target.closest('.style-card');
    if (!c) return;
    if (c.id === 'custom-tile') return;
    $$('.style-card').forEach(x => x.classList.remove('selected'));
    c.classList.add('selected');
    selectedStyle = c.dataset.id;
    customStyleImage = null;
    checkReady();
  });

  // === 自定义款式上传 ===
  $('#custom-style-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      customStyleImage = ev.target.result;
      const tile = $('#custom-tile');
      tile.classList.add('has-image');
      $('#custom-tile-content').innerHTML = `
        <img src="${customStyleImage}" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/20 flex items-end justify-center pb-1">
          <span class="text-[9px] bg-white/90 text-stone-600 px-1.5 py-0.5 font-medium tracking-wide">我的款式</span>
        </div>
      `;
      $$('.style-card').forEach(x => x.classList.remove('selected'));
      tile.classList.add('selected');
      selectedStyle = '__custom__';
      checkReady();
    };
    r.readAsDataURL(f);
  });

  // === 上传手部 ===
  $('#hand-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      handImage = ev.target.result;
      $('#hand-preview').innerHTML = `<img src="${handImage}" class="w-full max-h-72 object-contain bg-stone-50">`;
      $('#hand-preview').classList.remove('py-12', 'border-dashed');
      checkReady();
    };
    r.readAsDataURL(f);
  });

  function checkReady() {
    const styleReady = !!(selectedStyle && (selectedStyle !== '__custom__' || customStyleImage));
    $('#tryon-btn').disabled = !(handImage && styleReady && getNickname());
  }

  // === 试戴 ===
  $('#tryon-btn').addEventListener('click', async () => {
    if ($('#tryon-btn').disabled) return;
    feedbackSent.clear();
    $('#loading-overlay').classList.remove('hidden');
    $('#loading-overlay').classList.add('flex');
    const t0 = Date.now();
    const timer = setInterval(() => {
      $('#loading-elapsed').textContent = Math.floor((Date.now() - t0) / 1000);
    }, 500);

    const body = { user_id: userId, nickname: getNickname(), hand_image: handImage };
    if (customStyleImage && selectedStyle === '__custom__') {
      body.custom_style_image = customStyleImage;
    } else {
      body.style_id = selectedStyle;
    }

    try {
      const r = await fetch('/api/tryon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      clearInterval(timer);
      if (data.error) throw new Error(data.error);
      lastRequestId = data.request_id;
      $('#result-img').src = data.result_url;
      $$('.feedback-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('opacity-50');
        const a = b.dataset.action;
        if (a === 'like') b.innerText = '喜欢';
        if (a === 'dislike') b.innerText = '一般';
        if (a === 'book') b.innerText = '找附近门店做这款';
      });
      $('#loading-overlay').classList.add('hidden');
      $('#result-overlay').classList.remove('hidden');
      $('#result-overlay').classList.add('flex');
    } catch (err) {
      clearInterval(timer);
      $('#loading-overlay').classList.add('hidden');
      alert('试戴失败：' + err.message);
    }
  });

  // === 反馈 ===
  document.addEventListener('click', e => {
    const btn = e.target.closest('.feedback-btn');
    if (!btn || btn.disabled) return;
    const action = btn.dataset.action;
    if (action === 'book') {
      showShops();
      return;
    }
    if (feedbackSent.has(action)) return;
    feedbackSent.add(action);
    if (action === 'like' || action === 'dislike') {
      $$('.feedback-btn[data-action="like"], .feedback-btn[data-action="dislike"]').forEach(b => {
        b.disabled = true;
        b.classList.add('opacity-50');
      });
    }
    btn.innerText = action === 'like' ? '已收藏' : '已记录';
    fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        request_id: lastRequestId, user_id: userId, nickname: getNickname(),
        style_id: selectedStyle === '__custom__' ? '用户上传' : selectedStyle,
        action,
      }),
    });
  });

  $('#close-result').addEventListener('click', () => {
    $('#result-overlay').classList.add('hidden');
  });

  // === 门店列表 ===
  function showShops() {
    fetch('/api/shops').then(r => r.json()).then(shops => {
      $('#shops-list').innerHTML = shops.map(s => `
        <div class="shop-card border border-stone-200 p-4 active:bg-stone-50 cursor-pointer transition duration-300" data-shop="${s.id}">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm text-stone-800 truncate">${s.name}</div>
              <div class="text-xs text-stone-500 mt-1">${s.rating} · ${s.distance_km}km · 均价 ¥${s.price_avg}</div>
              <div class="text-[10px] text-stone-400 font-medium mt-0.5">${s.desc || ''}</div>
            </div>
            <button class="bg-stone-800 text-white text-xs font-medium px-3 py-1.5 shrink-0 hover:bg-stone-700 transition duration-300">预约</button>
          </div>
        </div>
      `).join('');
      $('#shops-list').addEventListener('click', e => {
        const card = e.target.closest('.shop-card');
        if (!card) return;
        fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            request_id: lastRequestId, user_id: userId, nickname: getNickname(),
            style_id: selectedStyle === '__custom__' ? '用户上传' : selectedStyle,
            action: 'book', shop_id: card.dataset.shop,
          }),
        });
        alert('预约请求已发送');
      });
      $('#shops-overlay').classList.remove('hidden');
      $('#shops-overlay').classList.add('flex');
    });
  }
  $('#close-shops').addEventListener('click', () => {
    $('#shops-overlay').classList.add('hidden');
  });

  // === 保存图片 ===
  $('#save-img').addEventListener('click', () => {
    const img = $('#result-img');
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `甲趣试戴_${lastRequestId || 'result'}.png`;
    a.click();
  });
</script>
</body>
</html>

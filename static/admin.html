<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲趣 · 运营中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
  }
  .stat-num {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b9d, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .bar {
    height: 24px;
    background: linear-gradient(90deg, #ff6b9d, #f472b6);
    border-radius: 6px;
    transition: width 0.6s;
  }
  .chat-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    height: 420px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .msg-user {
    background: #334155;
    border-radius: 12px 12px 4px 12px;
    padding: 10px 14px;
    margin-left: 40px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .msg-ai {
    background: #1a1a2e;
    border: 1px solid #334155;
    border-radius: 12px 12px 12px 4px;
    padding: 10px 14px;
    margin-right: 40px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .chat-input-area {
    border-top: 1px solid #334155;
    padding: 12px;
    display: flex;
    gap: 8px;
  }
  .chat-input-area input {
    flex: 1;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 10px;
    padding: 10px 14px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
  }
  .chat-input-area input:focus { border-color: #f472b6; }
  .chat-input-area button {
    background: linear-gradient(135deg, #ff6b9d, #f472b6);
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    color: white;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .shop-warn { color: #fbbf24; font-weight: 700; }
  .spinner-sm {
    width: 18px; height: 18px;
    border: 2px solid rgba(244,114,182,0.3);
    border-top-color: #f472b6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="max-w-6xl mx-auto px-4 py-6">

  <!-- Header -->
  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-black text-pink-400">甲趣 · 运营中心</h1>
      <p class="text-xs text-gray-500 mt-1">AI 驱动的美甲平台智能决策</p>
    </div>
    <a href="/" class="text-xs text-gray-400 hover:text-pink-400 transition">← 返回 C 端</a>
  </header>

  <!-- 概览数字 -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6" id="overview">
    <div class="card text-center">
      <div class="text-xs text-gray-400 mb-1">总试戴</div>
      <div class="stat-num" id="s-tryons">--</div>
    </div>
    <div class="card text-center">
      <div class="text-xs text-gray-400 mb-1">成功率</div>
      <div class="stat-num" id="s-success-rate">--</div>
    </div>
    <div class="card text-center">
      <div class="text-xs text-gray-400 mb-1">喜欢数</div>
      <div class="stat-num" id="s-likes">--</div>
    </div>
    <div class="card text-center">
      <div class="text-xs text-gray-400 mb-1">预约数</div>
      <div class="stat-num" id="s-books">--</div>
    </div>
    <div class="card text-center">
      <div class="text-xs text-gray-400 mb-1">平均耗时</div>
      <div class="stat-num" id="s-latency">--</div>
    </div>
  </div>

  <!-- 中间两列 -->
  <div class="grid md:grid-cols-2 gap-4 mb-6">
    <!-- 热门款式 -->
    <div class="card">
      <h2 class="text-sm font-bold text-gray-300 mb-3">热门款式 Top 10</h2>
      <div id="top-styles" class="space-y-2"></div>
    </div>
    <!-- 门店预约 -->
    <div class="card">
      <h2 class="text-sm font-bold text-gray-300 mb-3">门店预约排行</h2>
      <div id="top-shops" class="space-y-2"></div>
      <h2 class="text-sm font-bold text-gray-300 mt-4 mb-3">活跃用户 Top 10</h2>
      <div id="top-users" class="space-y-2"></div>
    </div>
  </div>

  <!-- AI 对话 -->
  <div class="card" style="padding:0;">
    <div class="px-5 pt-4 pb-2">
      <h2 class="text-sm font-bold text-gray-300">AI 运营助手 · DeepSeek</h2>
      <p class="text-xs text-gray-500 mt-1">基于实时用户行为数据，问任何运营问题</p>
    </div>
    <div class="chat-box" style="border:none; height:400px;">
      <div class="chat-messages" id="chat-messages">
        <div class="msg-ai">你好！我是甲趣 AI 运营助手。我能实时读取用户行为日志，帮你分析款式热度、转化率、门店数据、用户偏好等。

试试问我：
· "哪些款式试戴多但预约少？分析原因"
· "shop_003 的预约量是否异常？"
· "给我一份今日运营简报"</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="问 AI 任何运营问题..." autocomplete="off">
        <button id="chat-send">发送</button>
      </div>
    </div>
  </div>

</div>

<script>
const $ = q => document.querySelector(q);

// === 加载统计数据 ===
async function loadStats() {
  try {
    const r = await fetch('/api/admin/stats');
    const d = await r.json();

    $('#s-tryons').textContent = d.total_tryons;
    const rate = d.total_tryons ? Math.round(d.total_success / d.total_tryons * 100) : 0;
    $('#s-success-rate').textContent = rate + '%';
    $('#s-likes').textContent = d.total_likes;
    $('#s-books').textContent = d.total_books;
    $('#s-latency').textContent = (d.avg_latency_ms / 1000).toFixed(1) + 's';

    // 热门款式
    const maxCount = d.top_styles.length ? d.top_styles[0][1] : 1;
    $('#top-styles').innerHTML = d.top_styles.map(([sid, count], i) => {
      const likeRate = d.like_rates[sid] != null ? d.like_rates[sid] + '%' : '-';
      const w = Math.round(count / maxCount * 100);
      return `<div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500 w-5 text-right">${i+1}</span>
        <span class="w-16 font-mono text-gray-300">${sid}</span>
        <div class="flex-1"><div class="bar" style="width:${w}%"></div></div>
        <span class="w-8 text-right text-gray-300">${count}</span>
        <span class="w-12 text-right text-xs text-pink-400">${likeRate}</span>
      </div>`;
    }).join('');

    // 门店预约
    const shopNames = {shop_001:'粉黛(陆家嘴)',shop_002:'莫里斯(静安寺)',shop_003:'甲艺(田子坊)',shop_004:'NailLab(新天地)',shop_005:'甜心(豫园)'};
    const maxShop = d.top_shops.length ? d.top_shops[0][1] : 1;
    const avgShopBooks = d.top_shops.length ? d.top_shops.reduce((s,x)=>s+x[1],0) / d.top_shops.length : 0;
    $('#top-shops').innerHTML = d.top_shops.map(([sid, count]) => {
      const w = Math.round(count / maxShop * 100);
      const warn = count > avgShopBooks * 2 ? ' shop-warn' : '';
      return `<div class="flex items-center gap-2 text-sm">
        <span class="w-32 text-gray-300 truncate">${shopNames[sid]||sid}</span>
        <div class="flex-1"><div class="bar" style="width:${w}%"></div></div>
        <span class="w-8 text-right${warn}">${count}${warn ? ' ⚠️' : ''}</span>
      </div>`;
    }).join('');

    // 活跃用户
    $('#top-users').innerHTML = d.top_users.map(([name, count], i) => {
      return `<div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500 w-5 text-right">${i+1}</span>
        <span class="flex-1 text-gray-300">${name}</span>
        <span class="text-gray-400">${count} 次试戴</span>
      </div>`;
    }).join('');

  } catch(e) {
    console.error('Stats load failed:', e);
  }
}
loadStats();
setInterval(loadStats, 15000);

// === AI 对话 ===
const chatMessages = $('#chat-messages');
const chatInput = $('#chat-input');
const chatSend = $('#chat-send');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = role === 'user' ? 'msg-user' : 'msg-ai';
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

async function sendChat() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  chatInput.value = '';
  addMsg('user', msg);
  chatSend.disabled = true;
  const loading = addMsg('ai', '');
  loading.innerHTML = '<span class="spinner-sm"></span> AI 正在分析数据...';

  try {
    const r = await fetch('/api/admin/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg}),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    loading.textContent = d.reply;
  } catch(e) {
    loading.textContent = '出错了: ' + e.message;
  }
  chatSend.disabled = false;
  chatInput.focus();
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>

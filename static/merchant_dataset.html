<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲趣商家数据查看台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Noto+Serif+SC:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Vertex 甲趣数据查看台 — Rosé Lens（与 admin / index / merchant 同源）
     ============================================================ */
  :root {
    /* —— LENS: Bordeaux & Champagne —— */
    --bg:        #160b10;
    --mid:       #f1dccf;
    --warm-glow: rgba(212, 171, 124, 0.26);
    --accent:    #d4ab7c;
    --rose:      #c0808f;
    --gold:      #d4ab7c;

    /* —— 衍生表面 —— */
    --card:     color-mix(in srgb, var(--mid) 4%,  var(--bg));
    --elevated: color-mix(in srgb, var(--mid) 7%,  var(--bg));
    --hover:    color-mix(in srgb, var(--mid) 6%,  transparent);
    --border:   color-mix(in srgb, var(--mid) 12%, transparent);
    --hairline: color-mix(in srgb, var(--mid) 7%,  transparent);
    --input:    color-mix(in srgb, var(--mid) 6%,  var(--bg));

    /* —— 语义文字 —— */
    --t-primary:   var(--mid);
    --t-secondary: color-mix(in srgb, var(--mid) 66%, transparent);
    --t-tertiary:  color-mix(in srgb, var(--mid) 42%, transparent);

    /* —— 旧别名 —— */
    --panel:   var(--card);
    --panel-2: var(--elevated);
    --line:    var(--border);
    --text:    var(--t-primary);
    --muted:   var(--t-secondary);
    --faint:   var(--t-tertiary);

    --green: #9fd0b5;
    --red:   #e2a08e;
    --radius:    1rem;
    --radius-sm: 0.625rem;

    --font-display: "Fraunces", "Noto Serif SC", "Songti SC", "PingFang SC", serif;
    --font-body:    "Fraunces", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    --font-mono:    "DM Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.55;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: transparent;
  }

  /* ===== Backdrop：三层 fixed ===== */
  .bd { position: fixed; inset: 0; pointer-events: none; }
  .bd-vignette {
    z-index: -3;
    background:
      radial-gradient(120% 90% at 50% -10%,
        color-mix(in srgb, var(--mid) 5%, transparent) 0%, transparent 55%),
      radial-gradient(140% 120% at 50% 120%,
        #000 0%, transparent 60%);
    opacity: 0.9;
  }
  .bd-glow {
    z-index: -2;
    background:
      radial-gradient(ellipse at 0% 0%, transparent 56%, var(--warm-glow) 100%),
      radial-gradient(ellipse 70% 50% at 100% 100%, transparent 60%, rgba(192,128,143,0.14) 100%);
    mix-blend-mode: lighten;
    opacity: 0.32;
  }
  .bd-noise {
    z-index: -1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' fill='%23dcc4a8' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
    background-size: 440px 440px;
    mix-blend-mode: color-dodge;
    opacity: 0.26;
  }

  /* ===== 全局卡片顶部 1px 香槟金高光线 ===== */
  .card, .panel, .summary-card, .table-card {
    position: relative;
    overflow: hidden;
  }
  .card::before, .panel::before, .summary-card::before,
  .table-card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent,
      color-mix(in srgb, var(--accent) 38%, transparent) 50%, transparent);
    pointer-events: none;
    z-index: 1;
  }

  /* ===== 签名结构：mono eyebrow + 衬线标题 ===== */
  .panel-head { margin: 0; }
  .panel-eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.24em;
    color: var(--t-tertiary);
    margin-bottom: 5px;
  }
  .panel-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500; font-size: 1.3rem;
    letter-spacing: 0.005em;
    color: var(--t-primary);
  }

  button, input, select { font: inherit; }
  button { cursor: pointer; }

  .page {
    min-height: 100vh;
    padding: 28px;
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 18px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }

  .title h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(28px, 3.2vw, 40px);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: 0;
  }
  .title .title-eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.26em;
    color: var(--t-tertiary);
    margin-bottom: 8px;
  }

  .title p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .top-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
  }

  .pill-link,
  .version-pill {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--t-secondary);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .version-pill { color: var(--accent); }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }

  .summary-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 16px 18px;
  }

  .summary-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--t-tertiary);
    margin-bottom: 10px;
  }

  .summary-value {
    margin-top: 4px;
    font-family: var(--font-display);
    font-size: clamp(26px, 2.8vw, 38px);
    line-height: 1;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--t-primary);
    font-feature-settings: "tnum" 1;
  }

  .summary-note {
    margin-top: 9px;
    color: var(--t-secondary);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 16px;
  }

  .panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    min-height: 0;
  }

  .sidebar {
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  .sidebar-head,
  .detail-head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--hairline);
  }

  .section-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.005em;
    color: var(--t-primary);
  }

  .section-sub {
    margin: 8px 0 0;
    color: var(--t-secondary);
    font-size: 12.5px;
    line-height: 1.6;
  }

  .filters {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  .filters-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .input,
  .select {
    width: 100%;
    min-height: 38px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--t-primary);
    padding: 0 12px;
    outline: none;
    font-family: var(--font-body);
    font-size: 13px;
  }
  .input::placeholder { color: var(--t-tertiary); }
  .input:focus, .select:focus {
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .list {
    overflow: auto;
    padding: 12px;
  }

  .merchant-item {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--t-secondary);
    padding: 12px;
    display: grid;
    gap: 8px;
    margin-bottom: 6px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .merchant-item:hover {
    background: var(--hover);
    border-color: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--t-primary);
  }

  .merchant-item.active {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-color: color-mix(in srgb, var(--accent) 32%, transparent);
    color: var(--t-primary);
  }

  .merchant-name {
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.005em;
    color: var(--t-primary);
  }

  .merchant-meta {
    color: var(--t-tertiary);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .merchant-kpis {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    color: var(--t-primary);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    font-feature-settings: "tnum" 1;
  }

  .pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 18px 16px;
    border-top: 1px solid var(--hairline);
  }

  .pager button {
    min-height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--t-primary);
    padding: 0 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.15s, border-color 0.15s;
  }
  .pager button:hover:not(:disabled) {
    background: var(--hover);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .pager #pageInfo {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--t-tertiary);
    letter-spacing: 0.08em;
    font-feature-settings: "tnum" 1;
  }

  .pager button:disabled {
    opacity: 0.38;
    cursor: default;
  }

  .detail {
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  .detail-scroll {
    overflow: auto;
    padding: 16px;
    display: grid;
    gap: 14px;
  }

  .hero {
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: var(--radius);
    background:
      radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 58%),
      var(--elevated);
    padding: 20px 22px;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.9fr);
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent,
      color-mix(in srgb, var(--accent) 42%, transparent) 50%, transparent);
    pointer-events: none;
  }

  .hero-eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: var(--accent);
  }

  .hero-title {
    margin-top: 8px;
    font-family: var(--font-display);
    font-size: clamp(24px, 2.6vw, 32px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--t-primary);
  }

  .hero-desc {
    margin-top: 10px;
    color: var(--t-secondary);
    font-size: 13.5px;
    line-height: 1.8;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .metric-tile {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    padding: 12px 14px;
  }

  .metric-tile .label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--t-tertiary);
    margin-bottom: 8px;
  }

  .metric-tile .value {
    font-family: var(--font-display);
    color: var(--t-primary);
    font-size: 19px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.01em;
    font-feature-settings: "tnum" 1;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 18px 20px;
    min-width: 0;
  }

  .card h3 {
    margin: 0 0 14px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.005em;
    color: var(--t-primary);
  }

  .kv {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--hairline);
    color: var(--t-secondary);
    font-size: 13px;
  }

  .kv:first-of-type { border-top: 0; padding-top: 0; }
  .kv b {
    color: var(--t-primary);
    font-weight: 500;
    font-feature-settings: "tnum" 1;
  }

  .table-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
  }

  .table-head {
    padding: 18px 20px 8px;
  }

  .table-head h3 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.005em;
    color: var(--t-primary);
  }

  .table-head p {
    margin: 7px 0 0;
    color: var(--t-secondary);
    font-size: 11.5px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-feature-settings: "tnum" 1;
  }

  th, td {
    padding: 10px 16px;
    border-top: 1px solid var(--hairline);
    text-align: left;
    vertical-align: top;
  }

  th {
    color: var(--t-tertiary);
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    white-space: nowrap;
  }

  td {
    color: var(--t-secondary);
  }

  td strong {
    color: var(--t-primary);
    font-weight: 500;
  }

  .style-cell {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .style-preview {
    width: 54px;
    height: 54px;
    flex: 0 0 54px;
    border-radius: var(--radius-sm);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--rose) 12%, transparent)),
      var(--card);
    background-size: cover;
    background-position: center;
  }

  .style-submeta {
    margin-top: 4px;
    color: var(--t-tertiary);
    font-size: 10.5px;
    line-height: 1.5;
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  .empty,
  .loading {
    padding: 22px;
    color: var(--t-tertiary);
    font-size: 12.5px;
    line-height: 1.7;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }

  @media (max-width: 1120px) {
    .workspace { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .page { padding: 18px; }
    .summary-grid,
    .card-grid,
    .filters-row,
    .hero-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="bd bd-vignette"></div>
  <div class="bd bd-glow"></div>
  <div class="bd bd-noise"></div>
  <div class="page">
    <div class="topbar">
      <div class="title">
        <span class="title-eyebrow">Merchant Dataset</span>
        <h1>商家数据查看台</h1>
        <p>浏览你生成的商家样本，查看单店画像、主力款式、风格模板和最近日运营数据。</p>
      </div>
      <div class="top-links">
        <a class="pill-link" href="/admin">返回运营看板</a>
        <a class="pill-link" href="/merchant">进入商家端</a>
        <span class="version-pill" id="versionPill">merchant-data-ui</span>
      </div>
    </div>

    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card"><div class="summary-label">加载中</div><div class="summary-value">...</div></div>
      <div class="summary-card"><div class="summary-label">加载中</div><div class="summary-value">...</div></div>
      <div class="summary-card"><div class="summary-label">加载中</div><div class="summary-value">...</div></div>
      <div class="summary-card"><div class="summary-label">加载中</div><div class="summary-value">...</div></div>
    </div>

    <div class="workspace">
      <section class="panel sidebar">
        <div class="sidebar-head">
          <div class="panel-head">
            <span class="panel-eyebrow">Merchant List</span>
            <h2 class="section-title">商家列表</h2>
          </div>
          <p class="section-sub">支持按门店名、城市和风格模板筛选。点左侧商家，右边会展开完整数据。</p>
          <div class="filters">
            <input class="input" id="queryInput" placeholder="搜索门店名">
            <div class="filters-row">
              <select class="select" id="citySelect">
                <option value="">全部城市</option>
              </select>
              <select class="select" id="styleSelect">
                <option value="">全部模板</option>
              </select>
            </div>
          </div>
        </div>
        <div class="list" id="merchantList">
          <div class="loading">正在加载商家列表…</div>
        </div>
        <div class="pager">
          <button id="prevBtn" type="button">上一页</button>
          <span id="pageInfo">第 1 页</span>
          <button id="nextBtn" type="button">下一页</button>
        </div>
      </section>

      <section class="panel detail">
        <div class="detail-head">
          <div class="panel-head">
            <span class="panel-eyebrow">Single Shop Detail</span>
            <h2 class="section-title">单店数据详情</h2>
          </div>
          <p class="section-sub">查看单店画像、风格模板、近 30 天款式表现、近期日运营走势和低转化款式。</p>
        </div>
        <div class="detail-scroll" id="detailRoot">
          <div class="loading">请选择左侧一个商家以查看详情…</div>
        </div>
      </section>
    </div>
  </div>

<script>
const UI_VERSION = 'merchant-data-ui 2026-06-07 15:10';
const state = {
  page: 1,
  pageSize: 24,
  total: 0,
  query: '',
  city: '',
  style: '',
  selectedShopId: '',
  selectedDetail: null,
};

const $ = selector => document.querySelector(selector);
const summaryGrid = $('#summaryGrid');
const merchantList = $('#merchantList');
const detailRoot = $('#detailRoot');
const queryInput = $('#queryInput');
const citySelect = $('#citySelect');
const styleSelect = $('#styleSelect');
const prevBtn = $('#prevBtn');
const nextBtn = $('#nextBtn');
const pageInfo = $('#pageInfo');
const versionPill = $('#versionPill');

init();

async function init() {
  versionPill.textContent = UI_VERSION;
  bindEvents();
  await Promise.all([loadOverview(), loadMerchants()]);
}

function bindEvents() {
  let timer = null;
  queryInput.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      state.query = queryInput.value.trim();
      state.page = 1;
      loadMerchants();
    }, 220);
  });
  citySelect.addEventListener('change', () => {
    state.city = citySelect.value;
    state.page = 1;
    loadMerchants();
  });
  styleSelect.addEventListener('change', () => {
    state.style = styleSelect.value;
    state.page = 1;
    loadMerchants();
  });
  prevBtn.addEventListener('click', () => {
    if (state.page <= 1) return;
    state.page -= 1;
    loadMerchants();
  });
  nextBtn.addEventListener('click', () => {
    if (state.page * state.pageSize >= state.total) return;
    state.page += 1;
    loadMerchants();
  });
}

async function loadOverview() {
  try {
    const payload = await getJson('/api/admin/merchant-dataset/summary');
    renderOverview(payload);
    fillFilters(payload);
  } catch (error) {
    summaryGrid.innerHTML = `<div class="summary-card"><div class="summary-label">加载失败</div><div class="summary-note">${escapeHtml(error.message || String(error))}</div></div>`;
  }
}

function renderOverview(payload) {
  const totals = payload?.totals || {};
  const summary = payload?.summary || {};
  const cards = [
    { label: '商家总数', value: totals.merchants || summary.merchant_count || 0, note: '当前库里的门店画像总量' },
    { label: '风格模板', value: totals.style_personas || 0, note: '当前已覆盖的细分风格模板数量' },
    { label: '上架款式', value: totals.styles || summary.styles_total || 0, note: '所有门店合计的款式数量' },
    { label: '日运营数据', value: totals.shop_daily_rows || summary.shop_daily_rows || 0, note: '商家日级运营记录行数' },
  ];
  summaryGrid.innerHTML = cards.map(card => `
    <div class="summary-card">
      <div class="summary-label">${escapeHtml(card.label)}</div>
      <div class="summary-value">${formatNumber(card.value)}</div>
      <div class="summary-note">${escapeHtml(card.note)}</div>
    </div>
  `).join('');
}

function fillFilters(payload) {
  const cities = Array.isArray(payload?.cities) ? payload.cities : [];
  const styles = Array.isArray(payload?.styles) ? payload.styles : [];
  citySelect.innerHTML = '<option value="">全部城市</option>' + cities.map(item => `<option value="${escapeAttr(item.city)}">${escapeHtml(item.city)} (${formatNumber(item.merchant_count)})</option>`).join('');
  styleSelect.innerHTML = '<option value="">全部模板</option>' + styles.map(item => `<option value="${escapeAttr(item.style)}">${escapeHtml(item.style_name || item.style)} (${formatNumber(item.merchant_count)})</option>`).join('');
  citySelect.value = state.city;
  styleSelect.value = state.style;
}

async function loadMerchants() {
  merchantList.innerHTML = '<div class="loading">正在加载商家列表…</div>';
  try {
    const params = new URLSearchParams({
      page: String(state.page),
      page_size: String(state.pageSize),
      query: state.query,
      city: state.city,
      style: state.style,
    });
    const payload = await getJson(`/api/admin/merchant-dataset/shops?${params.toString()}`);
    state.total = Number(payload.total || 0);
    renderMerchantList(Array.isArray(payload.items) ? payload.items : []);
    const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
    pageInfo.textContent = `第 ${state.page} / ${totalPages} 页`;
    prevBtn.disabled = state.page <= 1;
    nextBtn.disabled = state.page >= totalPages;

    const items = Array.isArray(payload.items) ? payload.items : [];
    if (!items.length) {
      detailRoot.innerHTML = '<div class="empty">当前筛选条件下没有商家数据。</div>';
      state.selectedShopId = '';
      return;
    }
    const target = items.find(item => item.shop_id === state.selectedShopId) || items[0];
    if (!state.selectedShopId || target.shop_id !== state.selectedShopId || !state.selectedDetail) {
      await loadMerchantDetail(target.shop_id);
    }
  } catch (error) {
    merchantList.innerHTML = `<div class="empty">商家列表加载失败：${escapeHtml(error.message || String(error))}</div>`;
  }
}

function renderMerchantList(items) {
  if (!items.length) {
    merchantList.innerHTML = '<div class="empty">没有找到符合条件的商家。</div>';
    return;
  }
  merchantList.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'merchant-item';
    btn.dataset.shopId = item.shop_id;
    if (item.shop_id === state.selectedShopId) btn.classList.add('active');
    btn.innerHTML = `
      <div class="merchant-name">${escapeHtml(item.shop_name)}</div>
      <div class="merchant-meta">${escapeHtml(item.city || '')}${item.district ? ` / ${escapeHtml(item.district)}` : ''} · ${escapeHtml(item.style_persona_name || item.style_name || item.style || '')}</div>
      <div class="merchant-kpis">
        <span class="chip">款式 ${formatNumber(item.style_count || 0)}</span>
        <span class="chip">搜索 ${formatNumber(item.search_volume_30d || 0)}</span>
        <span class="chip">成交 ${formatNumber(item.group_buy_orders_30d || 0)}</span>
      </div>
    `;
    btn.addEventListener('click', () => loadMerchantDetail(item.shop_id));
    merchantList.appendChild(btn);
  });
}

async function loadMerchantDetail(shopId) {
  if (!shopId) return;
  state.selectedShopId = shopId;
  state.selectedDetail = null;
  syncListSelection();
  detailRoot.innerHTML = '<div class="loading">正在加载单店详情…</div>';
  try {
    const payload = await getJson(`/api/admin/merchant-dataset/shop/${encodeURIComponent(shopId)}?style_limit=16&daily_limit=14`);
    state.selectedDetail = payload;
    renderMerchantDetail(payload);
    syncListSelection();
  } catch (error) {
    detailRoot.innerHTML = `<div class="empty">详情加载失败：${escapeHtml(error.message || String(error))}</div>`;
  }
}

function syncListSelection() {
  document.querySelectorAll('.merchant-item').forEach(item => {
    item.classList.toggle('active', item.dataset.shopId === state.selectedShopId);
  });
}

function renderMerchantDetail(payload) {
  const profile = payload?.profile || {};
  const totals = payload?.totals || {};
  const topStyles = Array.isArray(payload?.top_styles) ? payload.top_styles : [];
  const lowStyles = Array.isArray(payload?.low_conversion_styles) ? payload.low_conversion_styles : [];
  const daily = Array.isArray(payload?.recent_daily_metrics) ? payload.recent_daily_metrics : [];

  detailRoot.innerHTML = `
    <section class="hero">
      <div>
        <div class="hero-eyebrow">${escapeHtml(profile.style_persona_name || profile.style_name || '商家样本')}</div>
        <div class="hero-title">${escapeHtml(profile.shop_name || '未命名门店')}</div>
        <div class="hero-desc">
          ${escapeHtml((profile.city || '') + (profile.district ? ` / ${profile.district}` : ''))} · ${escapeHtml(profile.style_persona_name || profile.style_name || profile.style || '未设置风格')} · 评分 ${escapeHtml(String(profile.rating ?? '未提供'))} · 客单价 ¥${escapeHtml(formatNumber(profile.avg_ticket || 0))}
        </div>
        <div class="merchant-kpis" style="margin-top:12px;">
          <span class="chip">主力款 ${escapeHtml(profile.hero_sku_name || '未设置')}</span>
          ${profile.style_persona_name ? `<span class="chip">模板 ${escapeHtml(profile.style_persona_name)}</span>` : ''}
        </div>
      </div>
      <div class="hero-grid">
        ${renderMetricTile('月营收', `¥${formatNumber(profile.monthly_revenue || 0)}`)}
        ${renderMetricTile('总款式数', formatNumber(totals.style_count || 0))}
        ${renderMetricTile('30天搜索', formatNumber(totals.search_volume_30d || 0))}
        ${renderMetricTile('30天成交', formatNumber(totals.group_buy_orders_30d || 0))}
        ${renderMetricTile('平均 CTR', formatPercent(totals.avg_ctr))}
        ${renderMetricTile('平均转化率', formatPercent(totals.avg_conversion_rate))}
      </div>
    </section>

    <div class="card-grid">
      <section class="card">
        <h3>门店画像</h3>
        ${renderKv('店主', profile.owner_name)}
        ${renderKv('商家模板', profile.style_persona_name)}
        ${renderKv('风格关键词', Array.isArray(profile.style_keywords) ? profile.style_keywords.join(' / ') : '')}
        ${renderKv('主推人群', Array.isArray(profile.target_audiences) ? profile.target_audiences.join(' / ') : '')}
        ${renderKv('评价数', formatNumber(profile.review_count || 0))}
        ${renderKv('复购率', formatPercent(profile.repeat_customer_rate))}
        ${renderKv('退款率', formatPercent(profile.refund_rate))}
        ${renderKv('投诉率', formatPercent(profile.complaint_rate))}
        ${renderKv('店铺状态', profile.store_status)}
      </section>
      <section class="card">
        <h3>近 30 天总览</h3>
        ${renderKv('点击量', formatNumber(totals.click_volume_30d || 0))}
        ${renderKv('加购量', formatNumber(totals.cart_volume_30d || 0))}
        ${renderKv('成交量', formatNumber(totals.group_buy_orders_30d || 0))}
        ${renderKv('退款单量', formatNumber(totals.refund_orders_30d || 0))}
        ${renderKv('30天 GMV', `¥${formatNumber(totals.gmv_30d || 0)}`)}
        ${renderKv('门店位置', `${profile.city || ''}${profile.district ? ` / ${profile.district}` : ''}`)}
      </section>
    </div>

    ${renderStylesTable('主力款式表现', '按成交、点击量和搜索量排序，适合快速看这家店最能打的款。', topStyles, true)}
    ${renderStylesTable('低转化款式观察', '按转化率从低到高排序，适合排查高点击低成交的款式。', lowStyles, false)}
    ${renderDailyTable(daily)}
  `;
}

function renderMetricTile(label, value) {
  return `
    <div class="metric-tile">
      <div class="label">${escapeHtml(label)}</div>
      <div class="value">${escapeHtml(value)}</div>
    </div>
  `;
}

function renderKv(label, value) {
  return `
    <div class="kv">
      <span>${escapeHtml(label)}</span>
      <b>${escapeHtml(value == null || value === '' ? '未提供' : String(value))}</b>
    </div>
  `;
}

function renderStylesTable(title, subtitle, rows, showTags) {
  if (!rows.length) {
    return `
      <section class="table-card">
        <div class="table-head">
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(subtitle)}</p>
        </div>
        <div class="empty">当前门店还没有可展示的款式数据。</div>
      </section>
    `;
  }
  return `
    <section class="table-card">
      <div class="table-head">
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(subtitle)}</p>
      </div>
      <table>
        <thead>
          <tr>
            <th>款式</th>
            <th>价格</th>
            <th>搜索</th>
            <th>点击</th>
            <th>成交</th>
            <th>CTR</th>
            <th>转化率</th>
            <th>趋势</th>
            <th>${showTags ? '标签' : '退款'}</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td>
                <div class="style-cell">
                  <div class="style-preview"${row.style_image_url ? ` style="background-image:url('${escapeAttr(row.style_image_url)}')"` : ''}></div>
                  <div>
                    <strong>${escapeHtml(row.style_name || row.style_id || '')}</strong>
                    <div class="style-submeta">
                      ${escapeHtml([
                        row.primary_style || '',
                        row.nail_shape || '',
                        row.nail_length || '',
                        row.primary_color || '',
                      ].filter(Boolean).join(' / ') || '未提供结构化风格字段')}
                    </div>
                  </div>
                </div>
              </td>
              <td>¥${formatNumber(row.price || 0)}</td>
              <td>${formatNumber(row.search_volume_30d || 0)}</td>
              <td>${formatNumber(row.click_volume_30d || 0)}</td>
              <td>${formatNumber(row.group_buy_orders_30d || 0)}</td>
              <td>${formatPercent(row.ctr)}</td>
              <td>${formatPercent(row.conversion_rate)}</td>
              <td>${escapeHtml(localizeTrend(row.trend_signal))}</td>
              <td>${showTags ? escapeHtml((Array.isArray(row.title_tags) ? row.title_tags.slice(0, 3).join(' / ') : row.launch_stage || '')) : formatNumber(row.refund_orders_30d || 0)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  `;
}

function renderDailyTable(rows) {
  if (!rows.length) {
    return `
      <section class="table-card">
        <div class="table-head">
          <h3>最近日运营数据</h3>
          <p>当前门店还没有日级运营记录。</p>
        </div>
      </section>
    `;
  }
  return `
    <section class="table-card">
      <div class="table-head">
        <h3>最近 14 天日运营数据</h3>
        <p>包含搜索、点击、咨询、成交、营收、投放消耗和收藏变化，适合看波动。</p>
      </div>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>搜索</th>
            <th>点击</th>
            <th>咨询</th>
            <th>成交</th>
            <th>营收</th>
            <th>投放</th>
            <th>复购</th>
            <th>退款</th>
            <th>收藏</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td><strong>${escapeHtml(row.date || '')}</strong></td>
              <td>${formatNumber(row.search_volume || 0)}</td>
              <td>${formatNumber(row.click_volume || 0)}</td>
              <td>${formatNumber(row.consultation_volume || 0)}</td>
              <td>${formatNumber(row.group_buy_orders || 0)}</td>
              <td>¥${formatNumber(row.revenue || 0)}</td>
              <td>¥${formatNumber(row.ad_spend || 0)}</td>
              <td>${formatNumber(row.repeat_orders || 0)}</td>
              <td>${formatNumber(row.refund_orders || 0)}</td>
              <td>${formatNumber(row.favorites_added || 0)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  `;
}

async function getJson(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function formatNumber(value) {
  const num = Number(value || 0);
  if (!Number.isFinite(num)) return '0';
  return num.toLocaleString('zh-CN');
}

function formatPercent(value) {
  if (value == null || value === '') return '未提供';
  const num = Number(value);
  if (!Number.isFinite(num)) return String(value);
  return `${Math.round(num * 100)}%`;
}

function localizeTrend(value) {
  return {
    breakout: '爆发中',
    rising: '上升中',
    stable: '稳定',
    cooling: '降温中',
    falling: '下滑中',
    flat: '平稳',
    up: '上行',
    down: '回落',
  }[String(value || '')] || String(value || '未标注');
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/"/g, '&quot;');
}
</script>
